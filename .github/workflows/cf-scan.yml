name: CF 反代 IP 优选（来源-1.txt · 按端口接力 · 断点续跑 · 直连精筛）

# 运行方式：手动点一次 Run workflow 即可，之后每次运行结束 → 等待 10 分钟 → 自动触发下一次。
#   - 每次运行只扫「端口队列里第一个未完成的端口」，该端口扫完就结束本次运行，下次换下一个端口
#   - 端口时间预算用完但没扫完，下次继续扫同一个端口
#   - 全部端口扫完 / 配置类错误（缺 CF_VERIFY_SNI、自检失败等）时自动停止接力
#   - 想中途停止：在 Actions 页面取消（Cancel）当前这次运行即可，不会再触发下一次
on:
  workflow_dispatch:
    inputs:
      ports:
        description: "端口队列（逗号分隔，按顺序逐个扫描；每次运行只扫第一个未完成的端口）"
        required: false
        default: "443,9443,30005,8880,2083,2053,8080,2096,24442,2082,1024,2087,2086,2095,1025,10443,2052,4443,4433,7443,10000,8085,27017,10002,20000,10001,28017,18080,11434,20202,20201,8000,10101,50001,44365,8081,444,4444,8001,49154,6443,14430,65530,10033,3389,11235,20002,18852"
      min_latency_ms:
        description: "最小延迟（ms，默认 20）：TCP 平均延迟低于该值的丢弃；填 0 表示不设下限"
        required: false
        default: "20"
      max_latency_ms:
        description: "最大延迟（ms，默认 350）"
        required: false
        default: "350"
      time_budget_min:
        description: "单次扫描时间预算（分钟，默认 50，上限为 job 超时减 10 分钟）：到点后停止扫描、验完队列并保存断点"
        required: false
        default: "50"
      batch_size:
        description: "每批扫描的 IP 数（默认 2000）：每批扫完立即送验证并落盘断点"
        required: false
        default: "2000"
      scan_concurrency:
        description: "TCP 扫描并发（默认 1500）"
        required: false
        default: "1500"
      scan_timeout_ms:
        description: "TCP 连接超时（ms，默认 1000）"
        required: false
        default: "1000"
      verify_concurrent:
        description: "verify.py 直连验证并发（默认 64）"
        required: false
        default: "64"
      reset_state:
        description: "仅本次生效：清空断点和待验证队列，从 443 / 来源-1.txt 开头重新扫描（true / false，默认 false）"
        required: false
        default: "false"
      clear_results:
        description: "仅本次生效：同时清空历史优选结果（true / false，默认 false）"
        required: false
        default: "false"

permissions:
  contents: write   # 提交断点和结果
  actions: write    # 触发下一次运行（gh workflow run）

# 断点文件是串行续跑的，同一时间只允许一个实例；后到的排队等待，不取消正在跑的
concurrency:
  group: cf-ip-scan
  cancel-in-progress: false

env:
  # 上一次运行结束后，等待多少分钟再自动触发下一次
  NEXT_RUN_WAIT_MIN: "10"

jobs:
  scan-and-verify:
    runs-on: ubuntu-latest
    # 公开仓库的 GitHub 托管 runner：单个 job 最长 6 小时（360 分钟），且分钟数不限量
    timeout-minutes: 60
    outputs:
      stop: ${{ steps.scan.outputs.stop }}   # true = 不再自动接力（端口全部扫完 / 配置类错误）
      port: ${{ steps.scan.outputs.port }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Scan (resume from checkpoint) & verify
        id: scan
        env:
          CF_SOURCE: "来源-1.txt"
          CF_VERIFY_SCRIPT: "verify.py"
          # 托管在 Cloudflare（橙云）上的你自己的域名；在仓库 Settings → Secrets/Variables 中新建 CF_VERIFY_SNI
          CF_VERIFY_SNI: ${{ secrets.CF_VERIFY_SNI || vars.CF_VERIFY_SNI }}
          CF_JOB_LIMIT_MIN: "60"      # 必须与上面的 timeout-minutes 保持一致
          CF_COMMIT_EVERY_MIN: "20"    # 运行期间每 20 分钟增量提交一次断点和结果
          CF_NEXT_RUN_WAIT_MIN: ${{ env.NEXT_RUN_WAIT_MIN }}
          CF_LOOP_FOREVER: "false"     # true：全部端口扫完后自动开始新一轮；false：扫完即停止接力
          CF_PORTS: ${{ github.event.inputs.ports }}
          CF_MIN_LATENCY_MS: ${{ github.event.inputs.min_latency_ms }}
          CF_MAX_LATENCY_MS: ${{ github.event.inputs.max_latency_ms }}
          CF_TIME_BUDGET_MIN: ${{ github.event.inputs.time_budget_min || '50' }}
          CF_BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          CF_SCAN_CONCURRENCY: ${{ github.event.inputs.scan_concurrency }}
          CF_SCAN_TIMEOUT_MS: ${{ github.event.inputs.scan_timeout_ms }}
          CF_VERIFY_CONCURRENT: ${{ github.event.inputs.verify_concurrent }}
          CF_RESET_STATE: ${{ github.event.inputs.reset_state }}
          CF_CLEAR_RESULTS: ${{ github.event.inputs.clear_results }}
        run: python3 cf_scan.py

      # 无论上一步成功、失败还是被取消，都把最新断点和结果提交回仓库
      - name: Commit final checkpoint & results
        if: always()
        run: |
          mkdir -p output/state
          git add output
          if ! git diff --staged --quiet; then
            git commit -m "chore: final checkpoint $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git push && break
              git pull --rebase --autostash || true
            done
          else
            echo "没有需要提交的变更。"
          fi

      - name: Show results
        if: always()
        run: |
          echo "=== 断点 ==="
          cat output/state/progress.json 2>/dev/null || echo "（无）"
          echo
          echo "=== 延迟最低的 20 个优选 IP:端口 ==="
          head -n 20 output/best_ip_ports.txt 2>/dev/null || true
          echo "累计优选 IP:端口 数: $(wc -l < output/best_ip_ports.txt 2>/dev/null || echo 0)"

  # 上一次运行（含收尾提交）结束后，等待 NEXT_RUN_WAIT_MIN 分钟，再触发新的一次运行
  next-run:
    needs: scan-and-verify
    # 扫描成功或失败都接力；被手动取消、或脚本声明不再接力（stop=true）时不接力
    if: ${{ !cancelled() && needs.scan-and-verify.outputs.stop != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 需大于 NEXT_RUN_WAIT_MIN
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait, then trigger the next run
        env:
          IN_PORTS: ${{ github.event.inputs.ports }}
          IN_MIN_LATENCY: ${{ github.event.inputs.min_latency_ms }}
          IN_MAX_LATENCY: ${{ github.event.inputs.max_latency_ms }}
          IN_TIME_BUDGET: ${{ github.event.inputs.time_budget_min }}
          IN_BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          IN_SCAN_CONCURRENCY: ${{ github.event.inputs.scan_concurrency }}
          IN_SCAN_TIMEOUT: ${{ github.event.inputs.scan_timeout_ms }}
          IN_VERIFY_CONCURRENT: ${{ github.event.inputs.verify_concurrent }}
          LAST_PORT: ${{ needs.scan-and-verify.outputs.port }}
        run: |
          set -euo pipefail
          echo "本次扫描端口：${LAST_PORT:-未知}；等待 ${NEXT_RUN_WAIT_MIN} 分钟后触发下一次运行…"
          sleep $((NEXT_RUN_WAIT_MIN * 60))

          wf="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          args=()
          add() { if [ -n "${2:-}" ]; then args+=(-f "$1=$2"); fi; }
          # 透传本次的扫描参数；reset_state / clear_results 故意不透传，避免每次接力都清空断点
          add ports             "${IN_PORTS:-}"
          add min_latency_ms    "${IN_MIN_LATENCY:-}"
          add max_latency_ms    "${IN_MAX_LATENCY:-}"
          add time_budget_min   "${IN_TIME_BUDGET:-}"
          add batch_size        "${IN_BATCH_SIZE:-}"
          add scan_concurrency  "${IN_SCAN_CONCURRENCY:-}"
          add scan_timeout_ms   "${IN_SCAN_TIMEOUT:-}"
          add verify_concurrent "${IN_VERIFY_CONCURRENT:-}"

          for i in 1 2 3 4 5; do
            if gh workflow run "$wf" --ref "$GITHUB_REF_NAME" "${args[@]}"; then
              echo "已触发下一次运行"
              exit 0
            fi
            echo "触发失败，20 秒后重试（$i/5）"
            sleep 20
          done
          echo "::error::多次触发下一次运行失败，自动接力中断；请手动 Run workflow 继续（断点已保存）"
          exit 1
